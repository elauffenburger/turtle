cmd:
  parts:
    - pipeline:
        - cmd:
            parts:
              - word:
                  parts:
                    - literal: echo
              - word:
                  parts:
                    - literal: world
        - cmd:
            parts:
              - word:
                  parts:
                    - literal: sed
              - word:
                  parts:
                    - str:
                        parts:
                          - s/o/a/
    - or_cmd:
        cmd:
          parts:
            - word:
                parts:
                  - literal: "true"
